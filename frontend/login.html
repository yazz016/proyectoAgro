<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroXpress | Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <!-- PANEL IZQUIERDO -->
            <div class="auth-brand">
                <div class="brand-content">
                    <div class="brand-logo">
                        <img src="assets/logo.png" alt="AgroXpress" class="logo-img">
                        <h1>
                            <span class="text-white">Agro</span>
                            <span class="text-green">Xpress</span>
                        </h1>
                    </div>
                    <p class="brand-slogan">Cultiva, inspira y avanza</p>
                    <div class="brand-features">
                        <div><i class="bi bi-tree-fill"></i> Gestión agrícola inteligente</div>
                        <div><i class="bi bi-people-fill"></i> Comunidad de agricultores</div>
                        <div><i class="bi bi-cart3"></i> Venta sin intermediarios</div>
                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO -->
            <div class="auth-form">
                <div class="wrapper">

                    <h2>Bienvenido de nuevo</h2>
                    <p class="subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>

                    <div id="loginMessage" class="form-message"></div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label>Correo electrónico <span class="required">*</span></label>
                            <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="form-group">
                            <label>Contraseña <span class="required">*</span></label>
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                        </div>

                        <div class="form-options">
                            <label class="remember-option">
                                <input type="checkbox" id="rememberMe">
                                <span>Recordarme</span>
                            </label>
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn-auth">
                            <span>Iniciar sesión</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </form>

                    <div class="auth-divider">
                        <span></span>
                        <p>O continúa con</p>
                        <span></span>
                    </div>

                    <div class="social-login">
                        <button type="button"><i class="bi bi-google"></i> Google</button>
                        <button type="button"><i class="bi bi-facebook"></i> Facebook</button>
                    </div>

                    <p class="auth-switch">
                        ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
                    </p>

                </div>
            </div>

        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
