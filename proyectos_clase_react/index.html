<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroXpress - Componentes React y Proyectos de Clase</title>
    <!-- Estilos base del laboratorio React -->
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #F0F5F0;
            color: #1F2A3E;
            margin: 0;
            padding: 24px;
        }
        .contenedor-demo {
            max-width: 1050px;
            margin: 0 auto;
        }
        .encabezado-demo {
            background: #124734;
            color: #FFFFFF;
            padding: 20px 24px;
            border-radius: 14px;
            margin-bottom: 24px;
        }
        .encabezado-demo h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
        }
        .encabezado-demo p {
            margin: 0;
            opacity: 0.9;
        }
        .agroxpress-react-section,
        .card-clase-react {
            background: #FFFFFF;
            border: 1px solid #DDE7DD;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }
        .filtros-react {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filtros-react input,
        .filtros-react select,
        .card-clase-react input {
            padding: 10px 12px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 0.95rem;
        }
        .grid-cultivos-react {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        .tarjeta-cultivo-react {
            border: 1px solid #DDE7DD;
            border-radius: 12px;
            padding: 16px;
            background: #FAFAFA;
        }
        .etiqueta-cat {
            display: inline-block;
            background: #124734;
            color: #FFFFFF;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        button {
            background: #124734;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #1a5a42;
        }
        .alerta-oferta-react {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-weight: 600;
        }
        .error-react {
            color: #DC2626;
            font-weight: 600;
        }
        .grid-ejercicios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
        }
        .card-clase-react label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            font-weight: 600;
        }
    </style>
    <!-- React 18 y Babel para ejecutar JSX directamente en el navegador -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Componente 1: Catálogo AgroXpress en React
        function CatalogoAgroXpress() {
            const [cultivos] = useState([
                { id: 1, nombre: 'Papa Criolla Lavada', categoria: 'Tubérculos', cantidad: 50, unidad: 'Kilo', precioUnitario: 3500, agricultor: 'Carlos Mendoza', ciudad: 'Tunja' },
                { id: 2, nombre: 'Café Especial Huila', categoria: 'Granos', cantidad: 20, unidad: 'Bulto', precioUnitario: 185000, agricultor: 'María Fernanda Ruiz', ciudad: 'Pitalito' },
                { id: 3, nombre: 'Aguacate Hass Exportación', categoria: 'Frutas', cantidad: 120, unidad: 'Kilo', precioUnitario: 6200, agricultor: 'Luis Alberto Gómez', ciudad: 'Rionegro' }
            ]);
            const [busqueda, setBusqueda] = useState('');
            const [categoriaSeleccionada, setCategoriaSeleccionada] = useState('Todas');
            const [mensajeOferta, setMensajeOferta] = useState('');

            const formatearCOP = (valor) => new Intl.NumberFormat('es-CO', {
                style: 'currency', currency: 'COP', maximumFractionDigits: 0
            }).format(valor);

            const cultivosFiltrados = cultivos.filter((c) => {
                const coincideNombre = c.nombre.toLowerCase().includes(busqueda.toLowerCase());
                const coincideCategoria = categoriaSeleccionada === 'Todas' || c.categoria === categoriaSeleccionada;
                return coincideNombre && coincideCategoria;
            });

            const handleOfertar = (cultivo) => {
                const valorTotal = cultivo.cantidad * cultivo.precioUnitario;
                setMensajeOferta(`Oferta iniciada para ${cultivo.nombre} (${cultivo.cantidad} ${cultivo.unidad}s) - Total lote: ${formatearCOP(valorTotal)}`);
            };

            return (
                <section className="agroxpress-react-section">
                    <h2>Marketplace AgroXpress (Componente React)</h2>
                    <div className="filtros-react">
                        <input
                            type="text"
                            placeholder="Buscar producto agrícola..."
                            value={busqueda}
                            onChange={(e) => setBusqueda(e.target.value)}
                        />
                        <select value={categoriaSeleccionada} onChange={(e) => setCategoriaSeleccionada(e.target.value)}>
                            <option value="Todas">Todas las categorías</option>
                            <option value="Tubérculos">Tubérculos</option>
                            <option value="Granos">Granos</option>
                            <option value="Frutas">Frutas</option>
                        </select>
                    </div>
                    {mensajeOferta && <div className="alerta-oferta-react">{mensajeOferta}</div>}
                    <div className="grid-cultivos-react">
                        {cultivosFiltrados.map((cultivo) => {
                            const valorTotalLote = cultivo.cantidad * cultivo.precioUnitario;
                            return (
                                <article key={cultivo.id} className="tarjeta-cultivo-react">
                                    <span className="etiqueta-cat">{cultivo.categoria}</span>
                                    <h3>{cultivo.nombre}</h3>
                                    <p><strong>Disponible:</strong> {cultivo.cantidad} {cultivo.unidad}(s)</p>
                                    <p><strong>Precio por unidad:</strong> {formatearCOP(cultivo.precioUnitario)} / {cultivo.unidad}</p>
                                    <p><strong>Valor total del lote:</strong> {formatearCOP(valorTotalLote)}</p>
                                    <p><strong>Productor:</strong> {cultivo.agricultor} ({cultivo.ciudad})</p>
                                    <button type="button" onClick={() => handleOfertar(cultivo)}>Hacer oferta</button>
                                </article>
                            );
                        })}
                    </div>
                </section>
            );
        }

        // Componente 2: Ejercicio de clase - Componente de Clase
        class SaludoAgricultor extends React.Component {
            constructor(props) {
                super(props);
                this.state = { cultivosActivos: 3, estadoFinca: 'Producción activa' };
            }
            agregarCultivo = () => {
                this.setState((prev) => ({ cultivosActivos: prev.cultivosActivos + 1 }));
            };
            render() {
                return (
                    <div className="card-clase-react">
                        <h3>Ejercicio 1: Componente de Clase</h3>
                        <p>Bienvenido, <strong>{this.props.nombre || 'Carlos Mendoza'}</strong></p>
                        <p>Estado actual: {this.state.estadoFinca}</p>
                        <p>Cultivos publicados: <strong>{this.state.cultivosActivos}</strong></p>
                        <button type="button" onClick={this.agregarCultivo}>+ Registrar nuevo cultivo</button>
                    </div>
                );
            }
        }

        // Componente 3: Ejercicio de clase - Eventos y validaciones
        function FormularioEventosReact() {
            const [producto, setProducto] = useState('');
            const [cantidad, setCantidad] = useState('');
            const [error, setError] = useState('');
            const [registros, setRegistros] = useState([]);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                if (!producto.trim()) return setError('Debes escribir el nombre del producto.');
                if (Number(cantidad) <= 0 || Number.isNaN(Number(cantidad))) return setError('La cantidad debe ser un número mayor a cero.');
                setRegistros([...registros, { id: Date.now(), producto: producto.trim(), cantidad: Number(cantidad) }]);
                setProducto('');
                setCantidad('');
            };

            return (
                <div className="card-clase-react">
                    <h3>Ejercicio 2: Eventos y Validación en React</h3>
                    <form onSubmit={handleSubmit}>
                        <label>
                            Nombre del producto:
                            <input type="text" value={producto} onChange={(e) => setProducto(e.target.value)} placeholder="Ej: Tomate chonto" />
                        </label>
                        <label>
                            Cantidad disponible (kg):
                            <input type="number" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="Ej: 25" />
                        </label>
                        {error && <p className="error-react">{error}</p>}
                        <button type="submit">Guardar en lista</button>
                    </form>
                    <ul>
                        {registros.map((item) => <li key={item.id}>{item.producto} — {item.cantidad} kg</li>)}
                    </ul>
                </div>
            );
        }

        // Aplicación principal que une el módulo formativo y los proyectos de clase
        function App() {
            return (
                <main className="contenedor-demo">
                    <header className="encabezado-demo">
                        <h1>GA7-220501096-AA4-EV03 — Front-end React y Proyectos de Clase</h1>
                        <p>Aprendiz: Jeimy Yazmin Gómez Arévalo | Ficha: 3186617 | Proyecto: AgroXpress</p>
                    </header>
                    <CatalogoAgroXpress />
                    <div className="grid-ejercicios">
                        <SaludoAgricultor nombre="Carlos Mendoza" />
                        <FormularioEventosReact />
                    </div>
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
